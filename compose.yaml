name: peridot

services:
  peridot:
    image: ghcr.io/ciriak/peridot:${PERIDOT_CHANNEL:-stable}
    restart: unless-stopped
    ports:
      - "${PERIDOT_PORT:-17430}:17430"
    volumes:
      - peridot-data:/data
      - ./music:/music:ro

  watchtower:
    image: nickfedor/watchtower:1.24.0
    restart: unless-stopped
    command: >-
      --label-enable
      --http-api-endpoints update
      --http-api-periodic-polls
      --cleanup
      --interval 21600
    depends_on:
      peridot:
        condition: service_healthy
    environment:
      WATCHTOWER_HTTP_API_TOKEN: /data/watchtower-token
    volumes:
      - peridot-data:/data:ro
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  peridot-data:
