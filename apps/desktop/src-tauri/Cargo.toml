[package]
name = "peridot-desktop"
version = "0.1.0"
description = "Native desktop shell for the Peridot music platform"
authors = ["Peridot contributors"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "peridot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-global-shortcut = "2.4.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
