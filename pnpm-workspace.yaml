packages:
  - apps/*
  - packages/*
overrides:
  "@nuxt/devtools": 4.2.0
allowBuilds:
  "@prisma/engines": true
  better-sqlite3: true
  esbuild: true
  node-pty: false
  prisma: true
  vue-demi: true
  workerd: false
minimumReleaseAgeExclude:
  - "@capgo/cli@8.108.0"
  - "@sentry/browser-utils@11.19.0"
  - "@sentry/browser@11.19.0"
  - "@sentry/bundler-plugins@11.19.0"
  - "@sentry/cloudflare@11.19.0"
  - "@sentry/core@11.19.0"
  - "@sentry/feedback@11.19.0"
  - "@sentry/node@11.19.0"
  - "@sentry/nuxt@11.19.0"
  - "@sentry/opentelemetry@11.19.0"
  - "@sentry/replay-canvas@11.19.0"
  - "@sentry/replay@11.19.0"
  - "@sentry/server-runtime-injection@11.19.0"
  - "@sentry/server-utils@11.19.0"
  - "@sentry/vue@11.19.0"
