name: CI
on:
  push:
    branches: [dev, master]
    tags: ["v*"]
  pull_request:
env:
  NODE_VERSION: "24.22.3"
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm version:check
      - run: pnpm db:validate
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: pnpm typecheck

  test:
    name: Test ${{ matrix.package }}
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - "@peridot/web"
          - "@peridot/server"
          - "@peridot/ui"
          - "@peridot/desktop"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run test --filter=${{ matrix.package }}

  test-android:
    name: Test Android
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm android:test

  build-web:
    name: Build Web
    needs: [test, test-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@peridot/web
        env:
          NUXT_PUBLIC_SENTRY_DSN: ${{ github.event_name == 'push' && secrets.NUXT_PUBLIC_SENTRY_DSN || '' }}
          SENTRY_AUTH_TOKEN: ${{ github.event_name == 'push' && secrets.SENTRY_AUTH_TOKEN || '' }}

  build-server:
    name: Build Server
    needs: [test, test-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@peridot/server

  build-desktop:
    name: Build Desktop
    needs: [test, test-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@peridot/web
        env:
          NUXT_PUBLIC_SENTRY_DSN: ${{ github.event_name == 'push' && secrets.NUXT_PUBLIC_SENTRY_DSN || '' }}
          SENTRY_AUTH_TOKEN: ${{ github.event_name == 'push' && secrets.SENTRY_AUTH_TOKEN || '' }}
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: pnpm --filter @peridot/desktop package
        env:
          NUXT_PUBLIC_SENTRY_DSN: ${{ github.event_name == 'push' && secrets.NUXT_PUBLIC_SENTRY_DSN || '' }}
          SENTRY_AUTH_TOKEN: ${{ github.event_name == 'push' && secrets.SENTRY_AUTH_TOKEN || '' }}

  build-android:
    name: Build Android
    needs: [test, test-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: pnpm install --frozen-lockfile
      - id: client
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" = "tag" ]]; then
            channel=stable
            version="$(node -p 'require("./package.json").version')"
          elif [[ "$GITHUB_REF_NAME" = "dev" || "$GITHUB_REF_NAME" = "master" ]]; then
            if [[ "$GITHUB_REF_NAME" = "master" ]]; then
              channel=beta
            else
              channel=dev
            fi
            version="0.0.${GITHUB_RUN_NUMBER}"
          else
            channel=local
            version="$(node -p 'require("./package.json").version')"
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: pnpm android:build
        env:
          PERIDOT_CLIENT_CHANNEL: ${{ steps.client.outputs.channel }}
          PERIDOT_CLIENT_VERSION: ${{ steps.client.outputs.version }}
          NUXT_PUBLIC_SENTRY_DSN: ${{ github.event_name == 'push' && secrets.NUXT_PUBLIC_SENTRY_DSN || '' }}
          SENTRY_AUTH_TOKEN: ${{ github.event_name == 'push' && secrets.SENTRY_AUTH_TOKEN || '' }}

  prepare-client-release:
    name: Prepare client release
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/dev' ||
      github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/tags/v'))
    needs: [test, test-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      channel: ${{ steps.version.outputs.channel }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" = "tag" ]]; then
            channel=stable
            version="$(node -p 'require("./package.json").version')"
            release_tag="$GITHUB_REF_NAME"
          else
            if [[ "$GITHUB_REF_NAME" = "master" ]]; then
              channel=beta
            else
              channel="$GITHUB_REF_NAME"
            fi
            version="0.0.${GITHUB_RUN_NUMBER}"
            release_tag="client-${channel}"
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          if ! gh release view "$release_tag" >/dev/null 2>&1; then
            if [[ "$channel" = "stable" ]]; then
              gh release create "$release_tag" --verify-tag \
                --title "Peridot ${release_tag}" \
                --notes "Peridot ${release_tag}"
            else
              gh release create "$release_tag" --target "$GITHUB_SHA" \
                --prerelease --title "Peridot ${channel} builds" \
                --notes "Rolling ${channel} client builds."
            fi
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  package-android-web:
    name: Package Android web update
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/dev' ||
      github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/tags/v'))
    needs: prepare-client-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Android web bundle
        run: pnpm android:generate
        env:
          PERIDOT_CLIENT_CHANNEL: ${{ needs.prepare-client-release.outputs.channel }}
          PERIDOT_CLIENT_VERSION: ${{ needs.prepare-client-release.outputs.version }}
          NUXT_PUBLIC_SENTRY_DSN: ${{ secrets.NUXT_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - name: Package and sign update
        run: |
          umask 077
          printf '%s' "$CAPGO_UPDATE_PRIVATE_KEY" > "$RUNNER_TEMP/capgo-v2.key"
          export CAPGO_UPDATE_PRIVATE_KEY_PATH="$RUNNER_TEMP/capgo-v2.key"
          pnpm --filter @peridot/android update:bundle
        env:
          CAPGO_UPDATE_PRIVATE_KEY: ${{ secrets.CAPGO_UPDATE_PRIVATE_KEY }}
          PERIDOT_CLIENT_CHANNEL: ${{ needs.prepare-client-release.outputs.channel }}
          PERIDOT_CLIENT_VERSION: ${{ needs.prepare-client-release.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-web-update
          path: apps/android/dist-update/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish Android web update
        shell: bash
        run: |
          gh release upload "${{ needs.prepare-client-release.outputs.tag }}" \
            apps/android/dist-update/android-web.zip \
            apps/android/dist-update/android-web-manifest.json \
            --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  publish-desktop:
    name: Publish desktop (${{ matrix.target }})
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/dev' ||
      github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/tags/v'))
    needs: prepare-client-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
            tauriTarget: ""
          - target: windows-x86_64
            runner: windows-latest
            tauriTarget: ""
          - target: darwin-universal
            runner: macos-15
            tauriTarget: universal-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
      - name: Install macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Prepare signed channel config
        shell: bash
        run: |
          export PERIDOT_CLIENT_CHANNEL="${{ needs.prepare-client-release.outputs.channel }}"
          export PERIDOT_CLIENT_VERSION="${{ needs.prepare-client-release.outputs.version }}"
          node scripts/prepare-desktop-release.mjs
          echo "PERIDOT_DESKTOP_CONFIG_PATH=$PERIDOT_DESKTOP_CONFIG_PATH" >> "$GITHUB_ENV"
        env:
          PERIDOT_DESKTOP_CONFIG_PATH: ${{ runner.temp }}/peridot-desktop-release.json
      - name: Build signed desktop bundles
        shell: bash
        run: |
          if [[ -n "${{ matrix.tauriTarget }}" ]]; then
            pnpm --filter @peridot/desktop exec tauri build \
              --config "$PERIDOT_DESKTOP_CONFIG_PATH" \
              --target "${{ matrix.tauriTarget }}"
          else
            pnpm --filter @peridot/desktop exec tauri build \
              --config "$PERIDOT_DESKTOP_CONFIG_PATH"
          fi
        env:
          PERIDOT_CLIENT_CHANNEL: ${{ needs.prepare-client-release.outputs.channel }}
          PERIDOT_CLIENT_VERSION: ${{ needs.prepare-client-release.outputs.version }}
          NUXT_PUBLIC_SENTRY_DSN: ${{ secrets.NUXT_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Verify Windows NSIS installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundleRoot = "apps/desktop/src-tauri/target/release/bundle"
          $installers = @(Get-ChildItem "$bundleRoot/nsis/*-setup.exe" -File)
          $signatures = @(Get-ChildItem "$bundleRoot/nsis/*.exe.sig" -File)
          $msiFiles = @(Get-ChildItem "$bundleRoot/msi/*.msi" -File -ErrorAction SilentlyContinue)
          if ($installers.Count -ne 1) {
            throw "Expected one NSIS installer, found $($installers.Count)."
          }
          if ($signatures.Count -ne 1) {
            throw "Expected one NSIS updater signature, found $($signatures.Count)."
          }
          if ($msiFiles.Count -ne 0) {
            throw "Windows desktop release unexpectedly produced an MSI installer."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: apps/desktop/src-tauri/target/**/release/bundle/**
          if-no-files-found: error
          retention-days: 1

  publish-desktop-release:
    name: Publish desktop update manifest
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/dev' ||
      github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/tags/v'))
    needs: [prepare-client-release, publish-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
      - name: Build updater manifest
        shell: bash
        run: |
          node scripts/desktop-updater-manifest.mjs \
            --input release-assets \
            --output release-assets/latest.json \
            --tag "${{ needs.prepare-client-release.outputs.tag }}"
        env:
          PERIDOT_CLIENT_VERSION: ${{ needs.prepare-client-release.outputs.version }}
      - name: Upload desktop release assets
        shell: bash
        run: |
          declare -A uploaded
          mapfile -d '' candidates < <(find release-assets -type f -print0)
          assets=()
          for asset in "${candidates[@]}"; do
            name="${asset##*/}"
            if [[ -n "${uploaded[$name]:-}" ]]; then
              continue
            fi
            uploaded[$name]=1
            assets+=("$asset")
          done
          gh release upload "${{ needs.prepare-client-release.outputs.tag }}" \
            "${assets[@]}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  publish-image:
    name: Publish Docker image (${{ matrix.arch }})
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/dev' ||
      github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/tags/v'))
    needs: [build-web, build-server, build-desktop, build-android]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify release tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - id: version
        run: echo "value=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ciriak/peridot
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.metadata.outputs.labels }}
          outputs: >-
            type=image,name=ghcr.io/ciriak/peridot,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            PERIDOT_BUILD_CHANNEL=${{ github.ref_type == 'tag' && 'stable' || github.ref_name == 'master' && 'beta' || github.ref_name }}
            PERIDOT_BUILD_TAG=${{ github.ref_type == 'tag' && github.ref_name || '' }}
            PERIDOT_BUILD_COMMIT=${{ github.sha }}
            PERIDOT_VERSION=${{ steps.version.outputs.value }}
            NUXT_PUBLIC_SENTRY_DSN=${{ secrets.NUXT_PUBLIC_SENTRY_DSN }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha,scope=peridot-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=peridot-${{ matrix.arch }}
      - name: Record image digest
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          test -n "$digest"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-image:
    name: Merge Docker image manifest
    needs: publish-image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ciriak/peridot
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Create multi-architecture manifest
        shell: bash
        run: |
          tags=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              tags+=(--tag "$tag")
            fi
          done <<< "${{ steps.metadata.outputs.tags }}"

          sources=()
          for digest_file in "$RUNNER_TEMP"/digests/*; do
            if [[ -f "$digest_file" ]]; then
              sources+=("ghcr.io/ciriak/peridot@sha256:$(basename "$digest_file")")
            fi
          done
          if (( ${#sources[@]} != 2 )); then
            echo "Expected two platform digests, found ${#sources[@]}" >&2
            exit 1
          fi

          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
